<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1412">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Мастерская ПК</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: sticky 3D stage beside a lesson panel; wide views (quiz, wiki, progress) drop the stage. Palette: graphite-green neutrals, PCB copper accent, probe-cyan for hints. */
:root{
  --bg:#edf0ee;--surface:#f8faf8;--surface2:#e3e8e5;--line:#ccd5d0;--fg:#14201c;--muted:#566860;
  --accent:#b8520a;--accent-fg:#ffffff;--accent-soft:#f6e3d3;
  --ok:#0f7d58;--ok-soft:#d7eee5;--warn:#8f6209;--warn-soft:#f6ebcf;--bad:#bb3326;--bad-soft:#f6dcd8;--cool:#0c7480;--cool-soft:#d3ebee;
  --font-d:'Unbounded','Exo 2',system-ui,sans-serif;
  --font-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:96px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412;--surface:#141e1b;--surface2:#1b2724;--line:#293935;--fg:#e4ece8;--muted:#8fa49a;
  --accent:#f0893a;--accent-fg:#1c0f04;--accent-soft:#3a2314;
  --ok:#3ecf92;--ok-soft:#12362a;--warn:#e6b04c;--warn-soft:#3a2f12;--bad:#f2695a;--bad-soft:#3d1a16;--cool:#4fcfdc;--cool-soft:#10353a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412;--surface:#141e1b;--surface2:#1b2724;--line:#293935;--fg:#e4ece8;--muted:#8fa49a;
  --accent:#f0893a;--accent-fg:#1c0f04;--accent-soft:#3a2314;
  --ok:#3ecf92;--ok-soft:#12362a;--warn:#e6b04c;--warn-soft:#3a2f12;--bad:#f2695a;--bad-soft:#3d1a16;--cool:#4fcfdc;--cool-soft:#10353a;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(18px,2.6vw,22px)}h2{font-size:16px}h3{font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.mono{font-family:var(--font-m)}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;flex:none;color:var(--fg)}
.brand b{display:block;font:600 15px/1.1 var(--font-d)}
.brand span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}.brand span b{display:inline;font:500 11px var(--font-m);color:var(--accent);letter-spacing:.02em}
.tabs{display:flex;gap:3px;padding:3px;background:var(--surface2);border-radius:12px;overflow-x:auto;scrollbar-width:none;order:3;flex:1 1 100%;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.tab svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.tab[aria-selected="true"] svg{stroke:var(--accent)}
#themeBtn{margin-left:auto}
@media (min-width:900px){.tabs{order:0;flex:0 1 auto;margin-left:auto}#themeBtn{margin-left:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{padding:8px;width:38px;height:38px}
.btn.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;max-width:1500px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body[data-wide] .layout{grid-template-columns:minmax(0,1fr);max-width:980px}
body[data-wide] .stage{display:none}
.panel{min-width:0}
.view{display:none}
.view.on{display:block;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 3D stage */
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh) + 12px);height:calc(100vh - var(--hh) - 28px);min-height:380px;display:grid;grid-template-rows:minmax(0,1fr) auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 25%,var(--surface),var(--surface2))}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;opacity:.3;pointer-events:none}
.gl{position:relative;min-height:0;touch-action:none;cursor:grab;outline:none}
.gl:active{cursor:grabbing}
.gl canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.hint{position:absolute;left:10px;top:8px;right:10px;font:400 11px/1.4 var(--font-m);color:var(--muted);pointer-events:none;letter-spacing:.02em}
.tip{position:absolute;z-index:3;transform:translate(-50%,-130%);padding:5px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font:500 12px/1.3 var(--font-b);white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stageMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.tools{position:relative;display:flex;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid var(--line);background:var(--surface);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tg{flex:none;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s}
.tg:hover{border-color:var(--accent)}
.tg[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.slider{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;flex:1 0 130px;min-width:130px;max-width:220px}
.slider input{flex:1;min-width:0;accent-color:var(--accent)}
body[data-big] .layout{grid-template-columns:minmax(0,1fr) minmax(0,360px)}
@media (max-width:899px){
  .layout{grid-template-columns:minmax(0,1fr)!important;gap:10px}
  .stage{height:min(34vh,300px);min-height:220px;top:calc(env(safe-area-inset-top,0px) + var(--hh) + 6px);z-index:20}
  body[data-big] .stage{height:62vh;max-height:560px}
  .hint{display:none}
}

/* content */
.head{display:grid;gap:6px;margin-bottom:10px}
.eyebrow{font:500 11px/1 var(--font-m);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:62ch;font-size:14px}@media (max-width:899px){.lead{font-size:13px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.kv{display:grid;gap:12px;margin-top:12px}
.kv h4{font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.cool{background:var(--cool-soft);color:var(--cool)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.grp{font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.partgrid{display:flex;flex-wrap:wrap;gap:6px}
.pc{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;display:inline-flex;gap:6px;align-items:center;transition:border-color .2s,background .2s}
.pc:hover{border-color:var(--accent)}
.pc.on{background:var(--accent-soft);border-color:var(--accent)}
.pc i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pc.seen i{background:var(--ok)}
.gaming .partgrid,.gaming .grp,.gaming #partCard{display:none}
.note{padding:10px 12px;border-radius:10px;font-size:14px;background:var(--cool-soft);border:1px solid color-mix(in srgb,var(--cool) 35%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.note b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s ease}

/* steps & options */
.steps{display:grid;gap:4px;margin-top:12px;max-height:210px;overflow:auto}
.st{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .2s}
.st:hover{background:var(--surface2)}
.st b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--font-m);background:var(--surface2)}
.st.done{color:var(--fg)}.st.done b{background:var(--ok);color:var(--bg)}
.st.cur{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}.st.cur b{background:var(--accent);color:var(--accent-fg)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:transform .15s,border-color .2s,background .2s}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(2px)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.scen{display:grid;gap:6px;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:transform .2s,border-color .2s}
.scen:hover{border-color:var(--accent);transform:translateY(-2px)}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.lvl i.f{background:var(--accent)}
.stars{color:var(--accent);letter-spacing:2px}
.ticket{padding:14px;border-radius:12px;border:1px dashed var(--muted);background:var(--surface2);display:grid;gap:6px}
.ticket .mono{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.log{display:grid;gap:6px;max-height:260px;overflow:auto}
.log div{font:13px/1.5 var(--font-m);padding:6px 10px;border-left:3px solid var(--line);background:var(--surface2);border-radius:0 8px 8px 0}
.log .g{border-color:var(--ok)}.log .b{border-color:var(--bad)}
.score{font:600 13px var(--font-m)}

/* wiki, progress */
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.wiki{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.wiki .card{display:grid;gap:6px;align-content:start}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach .a{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);opacity:.5}
.ach .a.got{opacity:1;border-color:var(--ok)}
.ring{width:120px;height:120px;flex:none}
.ring text{font:600 22px var(--font-d);fill:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats .card b{display:block;font:600 22px var(--font-d)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;z-index:80;padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:500;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{padding:14px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font:400 12px var(--font-m);letter-spacing:.04em}
.foot b{color:var(--accent);font-weight:500}

/* account, avatars, leaderboard */
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:color-mix(in srgb,var(--c,var(--accent)) 20%,var(--surface));color:var(--c,var(--accent));border:1.5px solid var(--c,var(--accent))}
.av svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#accBtn{display:inline-flex;align-items:center;gap:8px;padding:3px 10px 3px 4px;border-radius:99px;max-width:170px}
#accBtn.new{padding:6px 12px;background:var(--accent);color:var(--accent-fg);border-color:transparent}
#accBtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
@media (max-width:520px){#accBtn .nm{display:none}#accBtn{padding:3px}#accBtn.new{padding:6px 10px}}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(8,14,12,.55);backdrop-filter:blur(3px);overflow:auto}
.modal[hidden]{display:none}
.sheet{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;animation:rise .25s ease}
.fld{display:grid;gap:5px}
.fld label,.fld .lab{font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input[type=text]{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);width:100%}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avgrid button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;transition:border-color .2s,transform .15s}
.avgrid button:hover{transform:translateY(-1px)}
.avgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.avgrid svg{width:55%;height:55%;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.cols button[aria-pressed="true"]{border-color:var(--fg)}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface2);gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.sel{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.lb{display:grid;gap:6px;margin-top:12px}
.lr{display:grid;grid-template-columns:34px 38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.lr.me{border-color:var(--accent);background:var(--accent-soft)}
.lr .rk{font:600 14px var(--font-d);text-align:center;color:var(--muted)}
.lr.r1 .rk,.lr.r2 .rk,.lr.r3 .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}
.lr.r1 .rk{background:#c9961a}.lr.r2 .rk{background:#7f8c93}.lr.r3 .rk{background:#a0623a}
.lr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .pts{font:600 16px var(--font-d);text-align:right}
.lr .pts small{display:block;font:400 11px var(--font-m);color:var(--muted)}
.lr .x{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:-2px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12h6V9M23 12h-4M9 20h4l3 3h7M16 16h7" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2" fill="var(--accent)"/></svg>
    <div><b>Мастерская ПК</b><span>Тренажёр ПК · <b>By Xtedo ВТ-79</b></span></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" data-view="lab"><svg viewBox="0 0 24 24"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7zM3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>Лаборатория</button>
    <button class="tab" role="tab" data-view="build"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Сборка</button>
    <button class="tab" role="tab" data-view="diag"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Диагностика</button>
    <button class="tab" role="tab" data-view="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/></svg>Тест</button>
    <button class="tab" role="tab" data-view="rank"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>Рейтинг</button>
    <button class="tab" role="tab" data-view="wiki"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 1 2 2z"/></svg>Словарь</button>
    <button class="tab" role="tab" data-view="prog"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Прогресс</button>
  </nav>
  <button class="btn icon" id="themeBtn" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="btn sm" id="accBtn" aria-label="Профиль"></button>
</div></header>

<main class="layout">

    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;t0=performance.now();if(ptrs.size===2){const a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
    cv.addEventListener('pointermove',e=>{
      const p=ptrs.get(e.pointerId);
      if(!p){if(e.pointerType==='mouse')hoverAt(e);return}
      const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
      if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)tg.dist=Math.min(22,Math.max(3.5,tg.dist*pinch/d));pinch=d}
      else if(e.buttons===2||e.shiftKey){const k=tg.dist*.0014;const r=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
        tg.tx-=r.x*dx*k-u.x*dy*k;tg.ty-=r.y*dx*k-u.y*dy*k;tg.tz-=r.z*dx*k-u.z*dy*k}
      else{tg.az-=dx*.008;tg.el=Math.min(1.35,Math.max(-.4,tg.el+dy*.006))}
    });
    const up=e=>{
      const had=ptrs.delete(e.pointerId);pinch=0;
      if(had&&moved<6&&performance.now()-t0<600&&e.type==='pointerup'){const id=pickAt(e);if(S.onPick)S.onPick(id)}
    };
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    cv.addEventListener('wheel',e=>{e.preventDefault();tg.dist=Math.min(22,Math.max(3.5,tg.dist*Math.exp(e.deltaY*.0012)))},{passive:false});
    cv.addEventListener('dblclick',()=>S.resetView(true));
    el.addEventListener('keydown',e=>{const k=e.key;
      if(k==='ArrowLeft')tg.az+=.15;else if(k==='ArrowRight')tg.az-=.15;else if(k==='ArrowUp')tg.el=Math.min(1.35,tg.el+.1);else if(k==='ArrowDown')tg.el=Math.max(-.4,tg.el-.1);
      else if(k==='+'||k==='=')tg.dist=Math.max(3.5,tg.dist*.88);else if(k==='-')tg.dist=Math.min(22,tg.dist/.88);else return;e.preventDefault()});
  }
  function pickables(){
    const out=[];
    for(const id in M.parts){const p=M.parts[id];if(!p.vis||p.alpha<.99)continue;
      p.g.traverse(o=>{if((o.isMesh||o.isInstancedMesh)&&!o.userData.skipPick&&!o.parent.userData.skipPick&&!o.userData.fanPart)out.push(o)})}
    return out;
  }
  function pickAt(e){
    const r=renderer.domElement.getBoundingClientRect();
    mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mv,camera);const hit=ray.intersectObjects(pickables(),false)[0];
    if(!hit)return null;let o=hit.object;while(o&&!o.userData.pid)o=o.parent;return o?o.userData.pid:null;
  }
  let hoverBusy=false;
  function hoverAt(e){
    if(S.noHover||hoverBusy)return;hoverBusy=true;
    requestAnimationFrame(()=>{hoverBusy=false;const id=pickAt(e);if(id!==hovered){hovered=id;renderer.domElement.style.cursor=id?'pointer':'';if(S.onHover)S.onHover(id)}});
  }
  S.setSelected=id=>{selected=id};
  S.setHints=ids=>{hints=ids||[];hintSet=new Set(hints)};
  S.setExplode=v=>{explode=v};
  S.setXray=v=>{xray=v};
  S.setPower=v=>{power=v};
  S.setAuto=v=>{auto=v};
  S.setTheme=d=>{dark=d;if(M)M.edges.forEach(l=>l.material.color.setHex(d?0x7fa396:0x44564f))};
  S.run=v=>{running=v;if(v){last=performance.now();resize()}};
  S.resetView=anim=>{if(!camera)return;tg.az=.55;tg.el=.22;tg.dist=homeDist();tg.tx=0;tg.ty=.1;tg.tz=0;if(!anim)Object.assign(cam,tg)};
  S.partIds=()=>M?Object.keys(M.parts):[];
  S.isVisible=id=>!!M&&M.parts[id].vis;
  S.showAll=()=>{if(!M)return;for(const id in M.parts){const p=M.parts[id];p.vis=true;p.g.visible=true;p.alpha=1;p.off.set(0,0,0);p.tw=null;p.ghost=false}};
  S.hide=id=>{if(!M)return;const p=M.parts[id];p.vis=false;p.g.visible=false;p.tw=null;p.ghost=false};
  S.ghost=id=>{if(!M)return;const p=M.parts[id];p.vis=true;p.g.visible=true;p.alpha=.28;p.ghost=true;p.off.set(0,0,0);p.tw=null};
  S.install=(id,anim)=>{if(!M)return;const p=M.parts[id];p.vis=true;p.g.visible=true;p.ghost=false;
    if(!anim){p.alpha=1;p.off.set(0,0,0);p.tw=null;return}
    const from=p.dir.clone().multiplyScalar(1.3);p.off.copy(from);
    p.tw={t0:performance.now(),dur:850,from,a0:p.alpha<1?p.alpha:0,};p.alpha=p.tw.a0};
  S.frame=(ids,dist)=>{
    if(!M)return;const b=new THREE.Box3();let any=false;
    (ids||[]).forEach(id=>{const p=M.parts[id];if(p&&p.vis){p.g.updateMatrixWorld(true);b.union(new THREE.Box3().setFromObject(p.g));any=true}});
    if(!any){S.resetView(true);return}
    const c=b.getCenter(new THREE.Vector3());tg.tx=c.x;tg.ty=c.y;tg.tz=c.z;
    tg.dist=Math.max(dist||5,(dist||5)*Math.max(1,1.1/Math.max(.4,camera.aspect)));
  };
  S.project=id=>{
    if(!M)return null;const p=M.parts[id];if(!p)return null;p.g.updateMatrixWorld(true);
    const b=new THREE.Box3().setFromObject(p.g),c=b.getCenter(new THREE.Vector3());c.y=b.max.y;c.project(camera);
    if(c.z>1)return null;return{x:(c.x+1)/2*wrap.clientWidth,y:(1-c.y)/2*wrap.clientHeight};
  };
  S.name=null;

  let HOV,SEL,HNT;
  function loop(now){
    requestAnimationFrame(loop);
    if(!running||!S.ready)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;const k=1-Math.exp(-dt*9);
    if(auto&&!document.hidden)tg.az+=dt*.35;
    for(const key of ['az','el','dist','tx','ty','tz'])cam[key]+=(tg[key]-cam[key])*k;
    const cx=Math.cos(cam.el);
    camera.position.set(cam.tx+cam.dist*cx*Math.sin(cam.az),cam.ty+cam.dist*Math.sin(cam.el),cam.tz+cam.dist*cx*Math.cos(cam.az));
    camera.lookAt(cam.tx,cam.ty,cam.tz);
    pwr+=((power?1:0)-pwr)*Math.min(1,dt*4);fanSpeed+=((power?1:0)*10-fanSpeed)*Math.min(1,dt*1.6);
    M.leds.forEach(m=>{m.emissiveIntensity=pwr*.95});
    M.fans.forEach(f=>{f.blades.rotation.z-=fanSpeed*dt});
    const pulse=.5+.5*Math.sin(now/260);
    for(const id in M.parts){const p=M.parts[id];
      if(p.tw){const t=Math.min(1,(now-p.tw.t0)/p.tw.dur),e=ease(t);p.off.copy(p.tw.from).multiplyScalar(1-e);p.alpha=p.tw.a0+(1-p.tw.a0)*e;if(t>=1)p.tw=null}
      p.g.position.set(p.off.x+p.dir.x*explode,p.off.y+p.dir.y*explode,p.off.z+p.dir.z*explode);
      let col=null,amt=0;
      if(id===selected){col=SEL;amt=.55}else if(hintSet.has(id)){col=HNT;amt=.25+.35*pulse}else if(id===hovered){col=HOV;amt=.22}
      p.h+=((col?amt:0)-p.h)*.2;
      const focus=id===selected||hintSet.has(id)||id===hovered;
      p.xr+=((xray&&!focus?1:0)-p.xr)*.2;
      const op=(1-.88*p.xr)*p.alpha,tr=op<.995;
      for(const m of p.mats){
        if(m.emissive&&!m.userData.led){if(col)m.emissive.copy(col);m.emissiveIntensity=p.h*.75}
        const fo=m.userData.o*op;m.opacity=fo;
        const t2=tr||m.userData.o<1;if(m.transparent!==t2){m.transparent=t2;m.needsUpdate=true}
        m.depthWrite=!tr;
      }
    }
    renderer.render(scene,camera);
    if(S.tick)S.tick();
  }
  return S;
})();

/* ---------- navigation ---------- */
let view=null;
function go(v,silent){
  if(!VIEWS.includes(v))v='lab';
  if(view===v)return;
  const prev=view;view=v;
  if(!silent&&location.hash!=='#'+v)try{history.replaceState(null,'','#'+v)}catch(e){}
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===v));
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.body.toggleAttribute('data-wide',WIDE.has(v));
  Scene3D.run(!WIDE.has(v));
  Scene3D.setSelected(null);Scene3D.setHints([]);Scene3D.setPower(false);tipId=null;$('#tip').hidden=true;
  $('#tgPower').setAttribute('aria-pressed','false');
  if(v==='lab')labInit();else if(v==='build')buildInit();else if(v==='diag')diagInit();else if(v==='quiz')quizInit();else if(v==='rank')rankInit();else if(v==='wiki')wikiInit();else if(v==='prog')progInit();
  const hs=$('#hint');hs.hidden=false;

}

/* ---------- LAB ---------- */
let labSel=null,findMode=false,findTarget=null,findScore=0,findTries=0;
function labInit(){
  Scene3D.showAll();Scene3D.resetView(true);labSel=null;findMode=false;
  Scene3D.onPick=id=>{if(findMode)return findPick(id);if(id)selectPart(id);else{labSel=null;Scene3D.setSelected(null);renderLab()}};
  renderLab();
}
function selectPart(id){
  labSel=id;Scene3D.setSelected(id);Scene3D.frame([id],5.2);
  if(!ST.seen.includes(id)){ST.seen.push(id);save();checkAch()}
  renderLab();
}
function renderLab(){
  const el=$('#v-lab'),groups={};PARTS.forEach(p=>(groups[p.g]=groups[p.g]||[]).push(p));
  let h=`<div class="head"><span class="eyebrow">Лаборатория</span><h1>Разбери компьютер по деталям</h1><p class="lead">Вращай модель и нажимай на детали. Ползунок «Разнести» раздвигает компоненты, «Рентген» делает остальные прозрачными, «Питание» запускает вентиляторы и подсветку.</p></div>`;
  h+=`<div class="card" id="partCard">`;
  if(findMode){
    h+=`<div class="row sp"><span class="eyebrow">Режим «Найди деталь»</span><span class="score">${findScore} верно</span></div><h2 style="margin:8px 0">Нажми на модели: ${esc(PARTMAP[findTarget].n)}</h2><p class="muted">Попыток на деталь: ${findTries} из 2. После второй ошибки деталь подсветится сама.</p><div class="row" style="margin-top:12px"><button class="btn" id="findStop">Закончить</button></div>`;
  }else if(labSel){
    const p=PARTMAP[labSel];
    h+=`<div class="row sp"><h2>${esc(p.n)}</h2><span class="pill acc">${esc(p.g)}</span></div>
    <div class="kv"><div><h4>Что делает</h4><p>${esc(p.role)}</p></div><div><h4>Как ломается</h4><p>${esc(p.fail)}</p></div><div><h4>Как проверить</h4><p>${esc(p.check)}</p></div></div>
    <div class="note" style="margin-top:12px"><b>Совет мастера.</b> ${esc(p.tip)}</div>`;
  }else{
    h+=`<h2>Выбери деталь</h2><p class="muted" style="margin-top:6px">Нажми на деталь на 3D-модели или в списке ниже. Изучено: <b>${ST.seen.length}</b> из ${PARTS.length}.</p><div class="bar" style="margin-top:10px"><i style="width:${ST.seen.length/PARTS.length*100}%"></i></div><div class="row" style="margin-top:12px"><button class="btn pri" id="findStart">Найди деталь</button></div>`;
  }
  h+=`</div>`;
  Object.keys(groups).forEach(g=>{h+=`<div class="grp">${esc(g)}</div><div class="partgrid">`+groups[g].map(p=>`<button class="pc${labSel===p.id?' on':''}${ST.seen.includes(p.id)?' seen':''}" data-p="${p.id}"><i></i>${esc(p.n)}</button>`).join('')+`</div>`});

function findStart(){findMode=true;findScore=0;nextFind();Scene3D.setSelected(null);Scene3D.resetView(true)}
function nextFind(){findTries=0;const pool=PARTS.map(p=>p.id).filter(i=>i!==findTarget);findTarget=pool[Math.floor(Math.random()*pool.length)];Scene3D.setHints([]);renderLab()}
function findPick(id){
  if(!id)return;
  if(id===findTarget){findScore++;toast('Верно: '+PARTMAP[id].n);nextFind()}
  else{findTries++;toast('Это «'+PARTMAP[id].n+'». Ищи дальше');if(findTries>=2){Scene3D.setHints([findTarget])}renderLab()}

/* ---------- BUILD ---------- */
let bCur=0;
function buildInit(){
  Scene3D.onPick=id=>{if(id)toast(PARTMAP[id].n+': '+PARTMAP[id].role.split('.')[0])};
  bCur=Math.min(ST.built>=ASSEMBLY.length?0:ST.built,ASSEMBLY.length-1);
  bApply(false);renderBuild();
}
function bApply(anim){
  Scene3D.showAll();Scene3D.setPower(false);$('#tgPower').setAttribute('aria-pressed','false');
  const inst=new Set();
  ASSEMBLY.forEach((s,i)=>{if(i<bCur){if(s.part)inst.add(s.part);(s.also||[]).forEach(a=>inst.add(a))}});
  Scene3D.partIds().forEach(id=>{if(!inst.has(id))Scene3D.hide(id)});
  const s=ASSEMBLY[bCur];
  if(s&&s.part){Scene3D.ghost(s.part);(s.also||[]).forEach(a=>Scene3D.ghost(a));Scene3D.setHints([s.part,...(s.also||[])]);Scene3D.frame([s.part],6)}
  else{Scene3D.setHints([]);Scene3D.resetView(true)}
}
function renderBuild(){
  const el=$('#v-build'),s=ASSEMBLY[bCur],done=bCur>=ASSEMBLY.length;
  let h=`<div class="head"><span class="eyebrow">Сборка</span><h1>Собери ПК шаг за шагом</h1><p class="lead">Полупрозрачная деталь на модели показывает, куда она встанет. Прочитай шаг и нажми «Установить»: деталь займёт своё место.</p></div>`;
  h+=`<div class="card"><div class="row sp"><span class="eyebrow">Шаг ${Math.min(bCur+1,ASSEMBLY.length)} из ${ASSEMBLY.length}</span><span class="score">${Math.round(bCur/ASSEMBLY.length*100)}%</span></div><div class="bar" style="margin:8px 0 12px"><i style="width:${bCur/ASSEMBLY.length*100}%"></i></div>`;
  if(s){
    h+=`<h2>${esc(s.title)}</h2><p style="margin-top:8px">${esc(s.text)}</p><div class="note warn" style="margin-top:10px"><b>Внимание.</b> ${esc(s.warn)}</div>`;
    if(s.tools.length)h+=`<div class="grp">Понадобится</div><div class="partgrid">`+s.tools.map(t=>`<span class="pill">${esc(t)}</span>`).join('')+`</div>`;
    h+=`<div class="row" style="margin-top:14px"><button class="btn" id="bPrev"${bCur===0?' disabled':''}>Назад</button><button class="btn pri" id="bNext">${s.part?'Установить':'Включить ПК'}</button></div>`;
  }else{
    h+=`<h2>Сборка завершена</h2><p style="margin-top:8px">Компьютер собран и запущен: вентиляторы вращаются, подсветка горит. Теперь переходи в «Диагностику» и ищи неисправности.</p><div class="row" style="margin-top:14px"><button class="btn" id="bAgain">Собрать заново</button><button class="btn pri" id="bDiag">В диагностику</button></div>`;
  }
  h+=`</div><div class="grp">Все шаги</div><div class="steps">`+ASSEMBLY.map((a,i)=>`<button class="st${i<bCur?' done':''}${i===bCur&&!done?' cur':''}" data-i="${i}"><b>${i<bCur?'✓':i+1}</b>${esc(a.title)}</button>`).join('')+`</div>`;
  el.innerHTML=h;
  const bn=$('#bNext');if(bn)bn.addEventListener('click',bNext);
  const bp=$('#bPrev');if(bp)bp.addEventListener('click',()=>{bCur--;bApply();renderBuild()});
  const ba=$('#bAgain');if(ba)ba.addEventListener('click',()=>{bCur=0;bApply();renderBuild()});
  const bd=$('#bDiag');if(bd)bd.addEventListener('click',()=>go('diag'));
  el.querySelectorAll('.st').forEach(b=>b.addEventListener('click',()=>{bCur=+b.dataset.i;bApply();renderBuild()}));
  const cur=el.querySelector('.st.cur');if(cur)cur.scrollIntoView({block:'nearest'});
}
function bNext(){
  const s=ASSEMBLY[bCur];
  if(s.part){Scene3D.setHints([]);Scene3D.install(s.part,true);(s.also||[]).forEach(a=>Scene3D.install(a,true))}
  bCur++;
  if(bCur>ASSEMBLY.length-1&&!ASSEMBLY[bCur-1].part){}
  if(bCur===ASSEMBLY.length-1){/* final step: power on */}

  const signed=!!Acc.uid;
  if(!signed&&Acc.cfg){return openAuth()}
  const me=ST.me||{nick:signed&&Acc.auth.currentUser&&Acc.auth.currentUser.email?Acc.auth.currentUser.email.split('@')[0]:'',group:'',avatar:Math.floor(Math.random()*AVATARS.length),color:AVCOL[Math.floor(Math.random()*AVCOL.length)]};
  const f={group:me.group,avatar:me.avatar,color:me.color};
  const groups=[...new Set(Acc.players.map(p=>p.group).filter(Boolean))].sort();
  const sh=$('#sheet');
  sh.innerHTML=`<div class="row sp"><h2 id="mTitle">${ST.me?'Профиль':'Заверши регистрацию'}</h2><button class="btn icon" id="mClose" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="row" style="gap:12px"><span id="mPrev"></span><div style="flex:1;min-width:160px"><b>${esc(me.nick||'Гость')}</b><p class="muted" style="font-size:13px">${Acc.cfg?'Прогресс сохраняется в твоём аккаунте.':'Сайт не подключён к базе: профиль хранится только в этом браузере.'}</p></div></div>
  ${Acc.cfg?'':`<div class="fld"><label for="fNick">Никнейм</label><input type="text" id="fNick" maxlength="16" autocomplete="off" value="${esc(me.nick)}"></div>`}
  <div class="fld"><label for="fGroup">Группа</label><input type="text" id="fGroup" maxlength="12" autocomplete="off" list="glist" placeholder="Например, ВТ-79" value="${esc(f.group)}"><datalist id="glist">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
  <div class="fld"><span class="lab">Аватар</span><div class="avgrid" id="fAv"></div></div>
  <div class="fld"><span class="lab">Цвет</span><div class="cols" id="fCol"></div></div>
  <div class="err" id="fErr" role="alert"></div>
  <div class="row"><button class="btn pri" id="mSave">Сохранить</button><button class="btn" id="mCancel">Отмена</button>${signed?'<button class="btn sm" id="mOut" style="margin-left:auto">Выйти</button>':''}</div>
  ${signed?'<div class="row"><button class="btn sm" id="mDel">Удалить профиль</button></div>':''}`;
  wireAvatar(f);openModal();
  const err=t=>{$('#fErr').textContent=t};
  $('#mSave').onclick=async()=>{
    const group=$('#fGroup').value.trim().replace(/\s+/g,' ').toUpperCase();
    if(group.length<2||!/^[\p{L}\d\- ]+$/u.test(group))return err('Укажи группу: буквы, цифры и дефис, например ВТ-79');
    let nick=me.nick;
    if(!Acc.cfg){nick=$('#fNick').value.trim();if(!/^[\p{L}\d_.\-]{3,16}$/u.test(nick))return err('Ник: 3–16 символов')}
    ST.me={nick,group,avatar:f.avatar,color:f.color};save();
    $('#mSave').disabled=true;
    if(canSync()){await push(true);if(Acc.err){err('Не удалось сохранить в рейтинг. Повтори позже');$('#mSave').disabled=false;return}}
    renderAcc();closeModal();toast('Профиль сохранён');if(view==='rank')renderRank();
  };
  const out=$('#mOut');if(out)out.onclick=async()=>{await Acc.auth.signOut();wipeLocal();closeModal();toast('Ты вышел из аккаунта')};
  const del=$('#mDel');
  if(del){let armed=false;del.onclick=async()=>{
    if(!armed){armed=true;del.textContent='Нажми ещё раз: аккаунт удалится';return}
    try{await Acc.db.collection('players').doc(Acc.uid).delete();await Acc.auth.currentUser.delete();wipeLocal();closeModal();toast('Аккаунт удалён')}
    catch(e){err(e&&e.code==='auth/requires-recent-login'?'Для удаления выйди, войди заново и повтори':'Не удалось удалить')}}}
}
function wipeLocal(){ST=JSON.parse(JSON.stringify(DEF));try{localStorage.setItem('pc-trainer-v1',JSON.stringify(ST))}catch(e){}gotSet=new Set();Acc.last='';Acc.merged=false;renderAcc();if(view==='rank')renderRank();if(view==='prog')progInit()}
function openModal(){const modal=$('#modal');modal.hidden=false;document.addEventListener('keydown',escClose);modal.onclick=e=>{if(e.target===modal)closeModal()};$('#mClose').onclick=closeModal;$('#mCancel').onclick=closeModal}
function wireAvatar(f){
  const drawAv=()=>{$('#fAv').innerHTML=AVATARS.map((a,i)=>`<button type="button" data-i="${i}" aria-label="${a[0]}" title="${a[0]}" aria-pressed="${i===f.avatar}"><svg viewBox="0 0 24 24">${a[1]}</svg></button>`).join('');
    $('#fCol').innerHTML=AVCOL.map(c=>`<button type="button" data-c="${c}" style="--c:${c}" aria-label="Цвет ${c}" aria-pressed="${c===f.color}"></button>`).join('');
    $('#mPrev').innerHTML=avatar(f.avatar,f.color,56);
    $('#fAv').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{f.avatar=+b.dataset.i;drawAv()}));
    $('#fCol').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{f.color=b.dataset.c;drawAv()}))};
  drawAv();
}
function openAuth(){
  const f={avatar:Math.floor(Math.random()*AVATARS.length),color:AVCOL[Math.floor(Math.random()*AVCOL.length)]};
  const groups=[...new Set(Acc.players.map(p=>p.group).filter(Boolean))].sort();
  const reg=authMode==='reg';
  $('#sheet').innerHTML=`<div class="row sp"><h2 id="mTitle">${reg?'Регистрация':'Вход'}</h2><button class="btn icon" id="mClose" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="seg" role="group" aria-label="Режим"><button data-a="reg" aria-pressed="${reg}">Регистрация</button><button data-a="in" aria-pressed="${!reg}">Вход</button></div>
  <div class="fld"><label for="fNick">Никнейм</label><input type="text" id="fNick" maxlength="16" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="латиница, цифры, _ - ."></div>
  <div class="fld"><label for="fPass">Пароль</label><input type="password" id="fPass" autocomplete="${reg?"new-password":"current-password"}" placeholder="минимум 6 символов"></div>
  ${reg?`<div class="fld"><label for="fGroup">Группа</label><input type="text" id="fGroup" maxlength="12" autocomplete="off" list="glist" placeholder="Например, ВТ-79"><datalist id="glist">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
  <div class="row" style="gap:12px"><span id="mPrev"></span><span class="muted" style="font-size:13px">Выбери аватар и цвет</span></div>
  <div class="fld"><div class="avgrid" id="fAv"></div></div><div class="fld"><div class="cols" id="fCol"></div></div>`:''}
  <div class="err" id="fErr" role="alert"></div>
  <div class="row"><button class="btn pri" id="mGo">${reg?'Создать аккаунт':'Войти'}</button><button class="btn" id="mCancel">Отмена</button></div>
  <p class="muted" style="font-size:12px">${reg?'Пароль восстановить нельзя, запомни его. Прогресс с этого устройства перенесётся в аккаунт.':'После входа прогресс загрузится из аккаунта.'}</p>`;
  if(reg)wireAvatar(f);
  openModal();
  $('#sheet').querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{authMode=b.dataset.a;openAuth()}));
  const err=t=>{$('#fErr').textContent=t};
  const go=async()=>{
    const nick=$('#fNick').value.trim(),pw=$('#fPass').value;
    if(!/^[A-Za-z0-9_.\-]{3,16}$/.test(nick))return err('Ник: 3–16 символов, только латиница, цифры и _ - .');
    if(pw.length<6)return err('Пароль: минимум 6 символов');
    const mail=nick.toLowerCase()+MAIL;
    $('#mGo').disabled=true;err('');
    try{
      if(reg){
        const group=$('#fGroup').value.trim().replace(/\s+/g,' ').toUpperCase();
        if(group.length<2||!/^[\p{L}\d\- ]+$/u.test(group)){$('#mGo').disabled=false;return err('Укажи группу: буквы, цифры и дефис, например ВТ-79')}
        ST.me={nick,group,avatar:f.avatar,color:f.color};
        const cred=await Acc.auth.createUserWithEmailAndPassword(mail,pw);
        Acc.uid=cred.user.uid;Acc.last='';save();await push(true);
        toast('Аккаунт создан');
      }else{
        ST=JSON.parse(JSON.stringify(DEF));try{localStorage.setItem('pc-trainer-v1',JSON.stringify(ST))}catch(e){}
        Acc.merged=false;await Acc.auth.signInWithEmailAndPassword(mail,pw);toast('Ты вошёл в аккаунт');
      }
      renderAcc();closeModal();
    }catch(e){ if(reg)ST.me=null; $('#mGo').disabled=false;err(authErr(e))}
  };
  $('#mGo').onclick=go;
  $('#sheet').querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  setTimeout(()=>$('#fNick').focus(),30);
}
/* leaderboard */
let rankMode='players',rankGroup='';
function rankInit(){renderRank()}
const ms=p=>p.upd&&p.upd.toMillis?p.upd.toMillis():0;
function sortP(a,b){return b.score-a.score||ms(a)-ms(b)}
function renderRank(){
  const el=$('#v-rank');if(!el)return;
  const online=!!(Acc.db&&Acc.uid);
  let h=`<div class="head"><span class="eyebrow">Рейтинг</span><h1>Таблица лидеров</h1><p class="lead">Очки: 5 за каждую изученную деталь, 3 за шаг сборки и 30 за полную сборку, 20 за звезду сценария, до 50 за тест и 2 за найденную деталь.</p></div>`;
  const all=Acc.players.slice().sort(sortP);
  const mine=ST.me&&all.findIndex(p=>p.id===Acc.uid);
  if(ST.me){
    const sc=scoreOf(ST);
    h+=`<div class="card row sp" style="gap:12px"><div class="row" style="gap:12px">${avatar(ST.me.avatar,ST.me.color,48)}<div><b>${esc(ST.me.nick)}</b><div class="muted" style="font-size:13px">${esc(ST.me.group)}${online&&mine>=0?` · место ${mine+1} из ${all.length}`:''}</div></div></div><div class="row" style="gap:12px"><span class="pts mono" style="font:600 20px var(--font-d)">${sc}</span><button class="btn sm" id="rEdit">Профиль</button></div></div>`;
  }else{
    h+=`<div class="card"><h2>Войди, чтобы попасть в рейтинг</h2><p class="muted" style="margin:6px 0 12px">Выбери ник, пароль, группу и аватар. Это займёт полминуты, а прогресс сохранится на любом устройстве.</p><button class="btn pri" id="rEdit">Регистрация и вход</button></div>`;
  }
  if(!Acc.cfg)h+=`<div class="note warn" style="margin-top:12px"><b>Сайт ещё не подключён к базе данных.</b> Прогресс хранится только в этом браузере. Владельцу нужно вставить настройки Firebase в файл сайта.</div>`;
  else if(!Acc.uid)h+=`<div class="note warn" style="margin-top:12px"><b>Войди или зарегистрируйся.</b> Таблица лидеров видна только авторизованным студентам.</div>`;
  else if(Acc.err)h+=`<div class="note warn" style="margin-top:12px">Рейтинг загрузить не удалось (${esc(Acc.err)}). Обнови страницу позже.</div>`;
  else if(!Acc.loaded)h+=`<div class="note" style="margin-top:12px">${Acc.slow?'Рейтинг пока не отвечает. Данные могут быть устаревшими.':'Загружаю рейтинг…'}</div>`;
  if(online&&Acc.loaded){
    const groups=[...new Set(all.map(p=>p.group).filter(Boolean))].sort();
    h+=`<div class="row" style="margin-top:14px"><div class="seg" role="group" aria-label="Режим"><button data-m="players" aria-pressed="${rankMode==='players'}">Игроки</button><button data-m="groups" aria-pressed="${rankMode==='groups'}">Группы</button></div>`;
    if(rankMode==='players')h+=`<select class="sel" id="rGroup" aria-label="Фильтр по группе"><option value="">Все группы</option>${groups.map(g=>`<option${g===rankGroup?' selected':''}>${esc(g)}</option>`).join('')}</select>`;
    h+=`</div><div class="lb">`;
    if(rankMode==='players'){
      const list=all.filter(p=>!rankGroup||p.group===rankGroup);
      if(!list.length)h+=`<div class="card"><p class="muted">Здесь пока никого нет. Стань первым.</p></div>`;
      list.forEach((p,i)=>{
        const stars=Object.values(p.scen||{}).reduce((a,n)=>a+n,0),me=p.id===Acc.uid;
        h+=`<div class="lr r${i+1<=3?i+1:0}${me?' me':''}"><div class="rk">${i+1}</div>${avatar(p.avatar,p.color,38)}<div style="min-width:0"><div class="nm">${esc(p.nick)}${me?' (ты)':''}</div><div class="sub">${esc(p.group||'')} · ★ ${stars} · детали ${(p.seen||[]).length}/${PARTS.length} · сборка ${p.built||0}/${ASSEMBLY.length} · тест ${p.quiz||0}%</div></div><div class="pts">${p.score}<small>очков</small></div>${false&&!me?`<div class="x"><button class="btn sm" data-del="${p.id}">Удалить игрока</button></div>`:''}</div>`});
    }else{
      const g={};all.forEach(p=>{const k=p.group||'Без группы';(g[k]=g[k]||{n:0,s:0})&&(g[k].n++,g[k].s+=p.score)});
      const list=Object.entries(g).map(([k,v])=>({k,n:v.n,s:v.s,avg:Math.round(v.s/v.n)})).sort((a,b)=>b.avg-a.avg||b.n-a.n);
      if(!list.length)h+=`<div class="card"><p class="muted">Групп пока нет.</p></div>`;
      list.forEach((x,i)=>{const me=ST.me&&x.k===ST.me.group;
        h+=`<div class="lr r${i+1<=3?i+1:0}${me?' me':''}" style="grid-template-columns:34px minmax(0,1fr) auto"><div class="rk">${i+1}</div><div style="min-width:0"><div class="nm">${esc(x.k)}${me?' (твоя)':''}</div><div class="sub">участников: ${x.n} · всего очков: ${x.s}</div></div><div class="pts">${x.avg}<small>в среднем</small></div></div>`});
    }
    h+=`</div>`;
  }
  el.innerHTML=h;
  const re=$('#rEdit');if(re)re.addEventListener('click',()=>openProfile());
  el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{rankMode=b.dataset.m;renderRank()}));
  const rg=$('#rGroup');if(rg)rg.addEventListener('change',()=>{rankGroup=rg.value;renderRank()});
  el.querySelectorAll('[data-del]').forEach(b=>{let armed=false;b.addEventListener('click',async()=>{
    if(!armed){armed=true;b.textContent='Нажми ещё раз';return}
    try{await Acc.db.doc('players/'+b.dataset.del).delete();toast('Игрок удалён')}catch(e){toast('Не удалось удалить')}})});
}

/* ---------- boot ---------- */
function measure(){const h=document.querySelector('.top').offsetHeight;document.documentElement.style.setProperty('--hh',h+'px')}
new ResizeObserver(measure).observe(document.querySelector('.top'));measure();
const ok=Scene3D.init($('#gl'));
applyTheme(isDark);
if(!ok){const m=$('#stageMsg');m.hidden=false;m.innerHTML='<div><b>3D-модель не запустилась</b><p>Браузер не поддерживает WebGL или не загрузилась библиотека. Тексты, сценарии и тест работают без неё.</p></div>';$('#tools').hidden=true;$('#hint').hidden=true}
accInit();
go(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'lab',true);


</script>
</body>
</html>
